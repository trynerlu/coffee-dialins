<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F0F1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1110" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dial-In">
<title>Dial-In</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: phone-first single column (tested at 412px, Pixel 8 Pro), sticky search header, bottom tab bar in thumb reach.
   Library = calm neutrals; scores on a red→yellow→green scale; Palate = bold colour cards. */
:root{
  --bg:#F0F1EC; --surface:#FFFFFF; --sunk:#E5E7E0; --ink:#17191A; --muted:#5F665C; --line:#D7DAD0;
  --pick:#4338CA; --pick-ink:#FFFFFF;
  --sc-sat:72%; --sc-bg:87%; --sc-fg:25%; --sc-none:#DADDD4;
  /* palate card colours (same in both themes; each card sets its own text colour) */
  --w-lime:#D3F04A; --w-violet:#5537D6; --w-coral:#FF6A55; --w-yellow:#FFD34D; --w-sky:#5CC4F2;
  --w-ink:#18181D; --w-pink:#FF92CB; --w-green:#169B62; --w-orange:#FF9636; --w-cream:#F6EEDC;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1110; --surface:#191C1A; --sunk:#232724; --ink:#ECEEE8; --muted:#9CA396; --line:#2D322D;
  --pick:#A5B4FC; --pick-ink:#14123A; --sc-sat:55%; --sc-bg:21%; --sc-fg:74%; --sc-none:#2D322D; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1110; --surface:#191C1A; --sunk:#232724; --ink:#ECEEE8; --muted:#9CA396; --line:#2D322D;
  --pick:#A5B4FC; --pick-ink:#14123A; --sc-sat:55%; --sc-bg:21%; --sc-fg:74%; --sc-none:#2D322D; color-scheme:dark }

*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,select{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--pick);outline-offset:2px;border-radius:8px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.titlerow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.titlerow h1{font-size:32px;font-weight:800}
.count{color:var(--muted);font-size:14px}
.search{margin-top:12px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px;height:48px}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);outline:none}
.search svg{flex:none;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:10px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:40px;padding:0 15px;font-size:14px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{opacity:.55;font-size:13px}
.selwrap{position:relative;flex:none}
.selwrap select{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:40px;padding:0 34px 0 15px;font-size:14px;font-weight:500;color:var(--ink)}
.selwrap::after{content:"";position:absolute;right:15px;top:50%;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.chip.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}

/* picks shelf */
.shelf{margin-top:20px}
.shelf h2{font-size:20px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.shelf h2 span{font:400 14px var(--f-body);color:var(--muted)}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:76%;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));scroll-padding-inline:max(16px,env(safe-area-inset-left,0px))}
.rail::-webkit-scrollbar{display:none}
.pick{scroll-snap-align:start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;min-height:176px}
.pick .rt{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pick .ro{font-size:13px;font-weight:600;color:var(--pick)}
.pick h3{font-size:21px;line-height:1.15;margin-top:2px}
.pick .wh{font-size:14px;color:var(--muted)}
.pick .notes{font-size:14px;margin-top:auto;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* list */
.group{margin-top:22px}
.group > h2{font-size:15px;font-family:var(--f-body);font-weight:600;display:flex;justify-content:space-between;gap:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.group > h2 span{color:var(--muted);font-weight:400;white-space:nowrap}
.list{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) 46px 50px;gap:10px;align-items:center;width:100%;min-height:68px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0}
.row:active{background:var(--sunk)}
.name{font:600 17px/1.25 var(--f-display);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:14px;color:var(--muted);display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flagcol{display:grid;grid-template-rows:20px 20px;gap:4px}
.flag{display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:5px;height:20px}
.flag.p{background:var(--pick);color:var(--pick-ink)}
.flag.b{border:1.5px solid var(--pick);color:var(--pick)}
.score{display:inline-flex;align-items:center;justify-content:center;font:600 16px/1 var(--f-mono);height:40px;min-width:50px;border-radius:11px;
  background:hsl(var(--h) var(--sc-sat) var(--sc-bg));color:hsl(var(--h) var(--sc-sat) var(--sc-fg))}
.score.none{background:var(--sc-none);color:var(--muted)}
.score.big{font-size:32px;height:auto;min-width:92px;padding:14px 0;border-radius:16px;flex-direction:column;gap:4px}
.score.big small{font:500 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.empty{padding:48px 0;text-align:center;color:var(--muted)}
.legend{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-top:18px}
.legend .bar{flex:1;max-width:160px;height:8px;border-radius:4px;background:linear-gradient(90deg,hsl(4 var(--sc-sat) 55%),hsl(50 var(--sc-sat) 55%),hsl(130 var(--sc-sat) 40%))}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:440px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--sunk);border-radius:16px;padding:4px}
.tab{border:0;background:transparent;border-radius:12px;min-height:48px;font-weight:600;font-size:15px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
.tab[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .1)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .4);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:22px 22px 0 0;max-height:85vh;overflow:auto;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.sheet .in{max-width:640px;margin:0 auto}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:24px;display:flex;justify-content:space-between;align-items:center}
.sheet h3{font:600 13px var(--f-body);color:var(--muted);margin:20px 0 8px;letter-spacing:.06em;text-transform:uppercase}
.sheet .chips{flex-wrap:wrap;overflow:visible;margin-inline:0;padding-inline:0}
.btn{border:0;border-radius:14px;min-height:52px;padding:0 18px;font-weight:600;background:var(--ink);color:var(--bg)}
.sheet .actions{position:sticky;bottom:0;background:var(--surface);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));margin-top:16px;display:flex}
.sheet .actions .btn{flex:1}

/* detail */
.dhead{padding-block:12px 0;display:flex;justify-content:space-between;align-items:center}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:14px;min-height:44px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:500}
.hero{margin-top:18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start}
.hero .roaster{font-weight:600;color:var(--pick);font-size:15px}
.hero h1{font-size:clamp(30px,8.5vw,42px);line-height:1.04;margin-top:4px;font-weight:800}
.hero .where{color:var(--muted);margin-top:8px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.badge{font-size:14px;font-weight:500;padding:6px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.badge.p{background:var(--pick);color:var(--pick-ink);border-color:var(--pick)}
.badge.b{border:1.5px solid var(--pick);color:var(--pick)}
.verdict{margin-top:22px;font:400 20px/1.5 var(--f-display);letter-spacing:-.005em}
.lab{display:block;font:600 12px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.section{margin-top:28px}
.notes-chips{display:flex;flex-wrap:wrap;gap:6px}
.notes-chips span{background:var(--sunk);border-radius:9px;padding:7px 11px;font-size:15px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:0}
.facts div{background:var(--surface);padding:12px 14px;min-width:0}
.facts div:last-child:nth-child(odd){grid-column:1 / -1}
.facts dt{font-size:13px;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:500;overflow-wrap:anywhere}
details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:10px}
summary{list-style:none;min-height:56px;padding:8px 16px;display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font:400 22px/1 var(--f-mono);color:var(--muted);margin-left:auto}
details[open] summary::after{content:"–"}
summary .sub{font-weight:400;color:var(--muted);font-size:14px;margin-left:auto}
summary .score{height:30px;min-width:40px;font-size:14px;border-radius:8px}
.dbody{padding:0 16px 16px;font-size:15px}
.dbody p{margin:0 0 10px;max-width:65ch}
.recipe{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.recipe div{background:var(--sunk);border-radius:10px;padding:10px}
.recipe b{display:block;font:600 16px var(--f-mono)}
.recipe span{font-size:12px;color:var(--muted)}
.pours{font-size:14px;color:var(--muted)}
.link{display:inline-flex;gap:6px;align-items:center;min-height:44px;font-weight:500}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:15px;z-index:50}
.foot{color:var(--muted);font-size:13px;margin:22px 0 10px}

/* palate: wrapped-style cards */
.pal-head{padding-block:16px 4px}
.pal-head h1{font-size:32px;font-weight:800}
.pal-head p{margin:4px 0 0;color:var(--muted)}
.w{border-radius:24px;padding:22px 20px;margin-top:14px;position:relative;overflow:hidden;color:var(--fg,#141414);background:var(--bgc)}
.w .k{font:700 12px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.w h2{font:800 30px/1.05 var(--f-display);margin-top:10px;letter-spacing:-.02em}
.w p{margin:10px 0 0;font-size:16px;line-height:1.45;max-width:46ch}
.w .huge{font:800 clamp(72px,24vw,118px)/.9 var(--f-display);letter-spacing:-.04em;margin-top:12px}
.w .row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.w .row3 b{display:block;font:800 34px/1 var(--f-display)}
.w .row3 span{font-size:13px;opacity:.8}
.w button.inline{background:rgb(255 255 255 / .18);border:1.5px solid currentColor;border-radius:999px;min-height:44px;padding:0 16px;font-weight:600;margin-top:16px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px;margin-top:16px}
.vs div{text-align:center}
.vs b{display:block;font:800 clamp(56px,17vw,84px)/.9 var(--f-display);letter-spacing:-.03em}
.vs span{font-size:14px;font-weight:600}
.vs em{font-style:normal;font:700 15px var(--f-body);opacity:.7;padding-bottom:22px}
.vs .lo b{opacity:.45}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:8px;margin-top:18px}
.podium div{border-radius:14px 14px 4px 4px;padding:10px 8px;text-align:center;background:rgb(255 255 255 / .28);display:flex;flex-direction:column;justify-content:flex-end;min-width:0}
.podium b{font:800 26px/1 var(--f-display)}
.podium span{font-size:13px;font-weight:600;line-height:1.2;margin-top:6px;overflow-wrap:anywhere}
.podium small{font-size:12px;opacity:.75}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.split > div{border-radius:16px;padding:14px;background:rgb(255 255 255 / .22)}
.split h3{font:700 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;opacity:.8;margin-bottom:8px}
.split ol{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.split li{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:15px}
.split li span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.split li span:last-child{font-family:var(--f-mono);font-weight:500}
.facts-list{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}
.facts-list li{background:rgb(255 255 255 / .1);border-radius:14px;padding:12px 14px;font-size:15.5px;line-height:1.4}
.facts-list li b{font-family:var(--f-display);font-weight:800;font-size:18px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tags span{border-radius:999px;padding:7px 13px;font-weight:600;font-size:15px;background:rgb(255 255 255 / .35)}
.tags span small{font:500 12px var(--f-mono);opacity:.7;margin-left:4px}
.tags.dark span{background:rgb(0 0 0 / .12)}
.nerd{margin-top:28px}
.nerd > h2{font-size:22px}
.nerd > p{margin:4px 0 0;color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:12px}
.card > h3{font-size:18px}
.card > p.sub{margin:4px 0 12px;color:var(--muted);font-size:14px}
.card .chips{margin-inline:0;padding-inline:0;flex-wrap:wrap;margin-bottom:8px}
.drow{display:grid;grid-template-columns:minmax(0,8em) minmax(0,1fr) 4.4em;gap:10px;align-items:center;font-size:14px;min-height:30px}
.drow .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{position:relative;height:18px}
.track::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.track .mean{position:absolute;top:0;bottom:0;width:1.5px;background:var(--muted);opacity:.7}
.track .dot{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:hsl(var(--h) 70% 45%);border:2px solid var(--surface)}
.drow .v{text-align:right;font-family:var(--f-mono);font-size:13px}
.drow .v small{color:var(--muted);font-size:11px;display:block;line-height:1}
.axis{display:grid;grid-template-columns:minmax(0,8em) minmax(0,1fr) 4.4em;gap:10px;font:11px var(--f-mono);color:var(--muted);margin-top:4px}
.axis div:nth-child(2){display:flex;justify-content:space-between}
svg text{fill:var(--muted);font:10px var(--f-mono)}
.hist{display:flex;align-items:flex-end;gap:4px;height:110px;margin-top:22px}
.hist div{flex:1;border-radius:4px 4px 0 0;position:relative;min-height:2px;background:hsl(var(--h) 65% 50%)}
.hist div span{position:absolute;top:-18px;left:0;right:0;text-align:center;font:11px var(--f-mono);color:var(--muted)}
.hlab{display:flex;gap:4px;font:11px var(--f-mono);color:var(--muted);margin-top:4px}
.hlab span{flex:1;text-align:center}
@media (prefers-reduced-motion:no-preference){ .sheet{animation:up .22s ease-out} @keyframes up{from{transform:translateY(30px);opacity:.6}} }
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* Read-only: the logbook is written by tools/dialin_api.py (via Claude). The app only reads dialins.json. */
const REPO = "trynerlu/coffee-dialins", CACHE_KEY = "dialin.cache.v2";
let SEED = { entries: [] };
const SYNC = { state: "loading", at: null };
const KITS = {"home-espresso":"Home espresso","home-pour-over":"Home pour-over","home-french-press":"Home French press","office-espresso":"Office espresso","office-pour-over":"Office pour-over","office-french-press":"Office French press"};
const NEG_TAGS = new Set(["flat","boring","not well responding"]);
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtR = r => r ? (Number.isInteger(r) ? r + ".0" : String(r)) : "–";
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtDate = d => { if(!d) return ""; const [y,m,dd]=d.split("-"); return `${+dd} ${MONTHS[+m-1]} ${y}`; };
const fmtMonth = d => { if(!d) return "Undated"; const [y,m]=d.split("-"); return `${MONTHS[+m-1]} ${y}`; };
const hue = r => Math.round(4 + Math.max(0,Math.min(4,r-1))/4*126);   /* 1 → red, 3 → yellow, 5 → green */
const scoreEl = (r,big) => r
  ? `<span class="score${big?" big":""}" style="--h:${hue(r)}" aria-label="Rated ${r} of 5">${fmtR(r)}${big?"<small>out of 5</small>":""}</span>`
  : `<span class="score none${big?" big":""}" aria-label="Not rated">–${big?"<small>unrated</small>":""}</span>`;
const slug = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const splitList = s => (s||"").split(/[,·/]| and /).map(x=>x.trim()).filter(Boolean);
const ORIGIN_ALIAS = {"Sumatra":"Indonesia"};
const origins = s => splitList(s).map(o=>ORIGIN_ALIAS[o]||o).filter(o=>o!=="Blend");
function avg(a){ a=a.filter(x=>x>0); return a.length ? a.reduce((s,x)=>s+x,0)/a.length : 0; }
function wavg(items){ let s=0,w=0; for(const [r,wt] of items){ if(r>0){ s+=r*wt; w+=wt; } } return w ? s/w : 0; }
const W = e => e.isEarlyEntry ? 0.5 : 1;

function buildCoffees(entries){
  const m = new Map();
  for(const e of entries){ const k=(e.roaster+"|"+e.coffeeName).toLowerCase(); if(!m.has(k)) m.set(k,[]); m.get(k).push(e); }
  return [...m.values()].map(list => {
    list.sort((a,b)=> (b.rating-a.rating) || (b.date||"").localeCompare(a.date||""));
    const best=list[0], pick=f=>(list.find(e=>e[f])||{})[f]||"";
    return { key:"c-"+slug(best.roaster+"-"+best.coffeeName), name:best.coffeeName, roaster:best.roaster, entries:list, best,
      rating:best.rating, date:list.map(e=>e.date||"").sort().pop(),
      origin:pick("origin"), region:pick("region"), process:pick("process"), roastLevel:pick("roastLevel"),
      variety:pick("variety"), producer:pick("producer"), farm:pick("farm"), altitude:pick("altitude"),
      flavorNotes:pick("flavorNotes"), review:pick("review"), coffeeUrl:pick("coffeeUrl"), coffeeDescription:pick("coffeeDescription"),
      isChoice:list.some(e=>e.isChoice), wouldBuy:list.some(e=>e.wouldBuy),
      tags:[...new Set(list.flatMap(e=>e.tags||[]))], methods:[...new Set(list.flatMap(e=>e.brewMethods||[]))],
      early:list.every(e=>e.isEarlyEntry),
      search:[best.coffeeName,best.roaster,pick("origin"),pick("region"),pick("process"),pick("variety"),pick("producer"),pick("farm"),pick("flavorNotes"),list.flatMap(e=>e.tags||[]).join(" ")].join(" ").toLowerCase() };
  });
}

const S = { coffees:[], q:"", quick:"all", sort:"rating", group:"none",
  f:{origin:new Set(),process:new Set(),roast:new Set(),roaster:new Set(),tag:new Set()}, sheet:false, pf:"roast" };
try{ const v=JSON.parse(localStorage.getItem("dialin.view")||"{}"); if(v.sort) S.sort=v.sort; if(v.group) S.group=v.group; }catch(e){}
const saveView=()=>{ try{ localStorage.setItem("dialin.view",JSON.stringify({sort:S.sort,group:S.group})); }catch(e){} };

const QUICK=[["all","All"],["picks","My picks"],["buy","Buy again"],["filter","Pour over"],["espresso","Espresso"],["misses","Misses"]];
const FACETS=[["origin","Origin",c=>origins(c.origin).length?origins(c.origin):(c.origin==="Blend"?["Blend"]:[])],["process","Process",c=>c.process?[c.process]:[]],
  ["roast","Roast",c=>c.roastLevel?[c.roastLevel]:[]],["roaster","Roaster",c=>[c.roaster]],["tag","Tags",c=>c.tags]];

function filtered(){
  const q=S.q.trim().toLowerCase();
  return S.coffees.filter(c=>{
    if(q && !q.split(/\s+/).every(t=>c.search.includes(t))) return false;
    if(S.quick==="picks"&&!c.isChoice) return false;
    if(S.quick==="buy"&&!c.wouldBuy) return false;
    if(S.quick==="filter"&&!c.methods.includes("Pour Over")) return false;
    if(S.quick==="espresso"&&!c.methods.includes("Espresso")) return false;
    if(S.quick==="misses"&&!(c.rating>0&&c.rating<=2)) return false;
    for(const [k,,get] of FACETS){ const s=S.f[k]; if(s.size&&!get(c).some(v=>s.has(v))) return false; }
    return true;
  }).sort((a,b)=> S.sort==="rating" ? (b.rating-a.rating)||(b.date||"").localeCompare(a.date||"")
    : S.sort==="low" ? ((a.rating||9)-(b.rating||9))||(b.date||"").localeCompare(a.date||"")
    : S.sort==="date" ? (b.date||"").localeCompare(a.date||"") : a.roaster.localeCompare(b.roaster)||a.name.localeCompare(b.name));
}
const fcount=()=>Object.values(S.f).reduce((n,s)=>n+s.size,0);

const ICON={
  search:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  back:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
  share:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v14"/></svg>',
  book:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5z"/><path d="M4 19a2 2 0 0 0 2 2h13"/></svg>',
  palate:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6-5.3-3-5.3 3 1.2-6L3.4 9.3l6-.7z"/></svg>',
  filter:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>',
};

function rowHTML(c){
  const where=[c.origin,c.process].filter(Boolean).join(" · ");
  return `<li><button class="row" data-open="${c.key}">
    <span style="min-width:0"><span class="name">${esc(c.name)}</span><span class="meta">${esc(c.roaster)}${where?" · "+esc(where):""}</span></span>
    <span class="flagcol" aria-label="${[c.isChoice&&"My pick",c.wouldBuy&&"Would buy again"].filter(Boolean).join(", ")}">${c.isChoice?'<span class="flag p">Pick</span>':"<span></span>"}${c.wouldBuy?'<span class="flag b">Buy</span>':"<span></span>"}</span>
    ${scoreEl(c.rating)}</button></li>`;
}
function groupKey(c){ if(S.group==="roaster") return c.roaster; if(S.group==="origin") return origins(c.origin)[0]||(c.origin==="Blend"?"Blends":"Unknown origin"); if(S.group==="month") return c.date?c.date.slice(0,7):"0000"; return ""; }

function libraryHTML(){
  const list=filtered(), fc=fcount(), showShelf=!S.q&&S.quick==="all"&&!fc;
  const picks=S.coffees.filter(c=>c.isChoice).sort((a,b)=>b.rating-a.rating||(b.date||"").localeCompare(a.date||""));
  let body="";
  if(!S.coffees.length) body=`<div class="empty">${SYNC.state==="error"?"Couldn't load the logbook. Check your connection and tap Refresh.":"Loading the logbook…"}</div>`;
  else if(!list.length) body=`<div class="empty">No coffees match.<br><button class="chip" style="margin-top:12px" data-act="clear">Clear filters</button></div>`;
  else if(S.group==="none") body=`<ul class="list" style="margin-top:8px">${list.map(rowHTML).join("")}</ul>`;
  else{
    const g=new Map(); for(const c of list){ const k=groupKey(c); if(!g.has(k)) g.set(k,[]); g.get(k).push(c); }
    let keys=[...g.keys()];
    if(S.group==="month") keys.sort().reverse(); else keys.sort((a,b)=>avg(g.get(b).map(c=>c.rating))-avg(g.get(a).map(c=>c.rating))||a.localeCompare(b));
    body=keys.map(k=>{ const cs=g.get(k); return `<section class="group"><h2>${esc(S.group==="month"?fmtMonth(k==="0000"?"":k):k)} <span>${cs.length} · avg ${avg(cs.map(c=>c.rating)).toFixed(1)}</span></h2><ul class="list">${cs.map(rowHTML).join("")}</ul></section>`; }).join("");
  }
  const active=FACETS.flatMap(([k])=>[...S.f[k]].map(v=>`<button class="chip" aria-pressed="true" data-unf="${k}" data-v="${esc(v)}">${esc(v)} <span aria-hidden="true">×</span></button>`)).join("");
  return `
  <header class="top"><div class="wrap">
    <div class="titlerow"><h1>Library</h1><span class="count" id="libcount">${list.length} of ${S.coffees.length} coffees</span></div>
    <label class="search">${ICON.search}<input id="q" type="search" placeholder="Coffee, roaster, origin, notes" value="${esc(S.q)}" autocomplete="off" aria-label="Search"></label>
    <div class="chips" role="group" aria-label="Quick filters">${QUICK.map(([k,l])=>`<button class="chip" aria-pressed="${S.quick===k}" data-quick="${k}">${l}</button>`).join("")}</div>
    <div class="chips">
      <button class="chip${fc?" on":""}" data-act="sheet">${ICON.filter} Filter${fc?` · ${fc}`:""}</button>
      <span class="selwrap"><select id="sort" aria-label="Sort"><option value="rating">Best rated</option><option value="low">Lowest rated</option><option value="date">Newest</option><option value="roaster">Roaster A–Z</option></select></span>
      <span class="selwrap"><select id="group" aria-label="Group"><option value="none">No grouping</option><option value="roaster">By roaster</option><option value="origin">By origin</option><option value="month">By month</option></select></span>
    </div>
    ${active?`<div class="chips">${active}</div>`:""}
  </div></header>
  <main class="wrap" id="libmain">
    ${showShelf&&picks.length?`<section class="shelf"><h2>My picks <span>${picks.length} to show a friend</span></h2>
      <div class="rail">${picks.map(c=>`<button class="pick" data-open="${c.key}">
        <span class="rt"><span style="min-width:0"><span class="ro">${esc(c.roaster)}</span><h3>${esc(c.name)}</h3></span>${scoreEl(c.rating)}</span>
        <span class="wh">${esc([c.origin,c.process].filter(Boolean).join(" · "))}</span>
        <span class="notes">${esc(c.flavorNotes||c.review)}</span></button>`).join("")}</div></section>
      <h2 style="font-size:20px;margin-top:24px">All coffees</h2>`:""}
    ${body}
    <div class="legend"><span>1</span><span class="bar"></span><span>5</span><span style="margin-left:6px">Pick = my pick · Buy = would buy again</span></div>
    <p class="foot">${syncLine()} New coffees arrive through Claude.</p>
  </main>`;
}

function sheetHTML(){
  const counts={}; for(const [k,,get] of FACETS){ counts[k]=new Map(); for(const c of S.coffees) for(const v of get(c)) counts[k].set(v,(counts[k].get(v)||0)+1); }
  return `<div class="scrim" data-act="close"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Filters"><div class="in"><div class="grab"></div>
    <h2>Filters <button class="chip" data-act="reset">Reset</button></h2>
    ${FACETS.map(([k,label])=>`<h3>${label}</h3><div class="chips">${[...counts[k].entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).map(([v,n])=>`<button class="chip" aria-pressed="${S.f[k].has(v)}" data-f="${k}" data-v="${esc(v)}">${esc(v)} <span class="n">${n}</span></button>`).join("")}</div>`).join("")}
    <div class="actions"><button class="btn" data-act="close">Show ${filtered().length} coffees</button></div>
  </div></div>`;
}

function detailHTML(c){
  const facts=[["Origin",[c.origin,c.region].filter(Boolean).join(", ")],["Producer",[c.producer,c.farm].filter(Boolean).join(" · ")],["Variety",c.variety],["Process",c.process],["Altitude",c.altitude],["Roast",c.roastLevel]].filter(f=>f[1]);
  const notes=splitList(c.flavorNotes);
  const badges=[c.isChoice?'<span class="badge p">My pick</span>':"",c.wouldBuy?'<span class="badge b">Would buy again</span>':"",...c.tags.map(t=>`<span class="badge">${esc(t)}</span>`)].join("");
  const brews=c.entries.map(e=>{
    const esp=(e.brewMethods||[]).includes("Espresso"), cells=[];
    if(e.doseIn) cells.push([e.doseIn+" g","Dose"]);
    if(e.yieldOut) cells.push([e.yieldOut+" g",esp?"Yield":"Water"]);
    if(e.doseIn&&e.yieldOut) cells.push(["1:"+(e.yieldOut/e.doseIn).toFixed(esp?1:0),"Ratio"]);
    if(e.temperature) cells.push([e.temperature+"°C","Temp"]);
    if(e.timeSeconds) cells.push([Math.floor(e.timeSeconds/60)+":"+String(e.timeSeconds%60).padStart(2,"0"),"Time"]);
    if(e.grindSetting) cells.push([e.grindSetting,(e.grinder||"Grind").replace(/^(Timemore|Eureka|Baratza) /,"")]);
    const pours=(e.filterPours||[]).length?`<p class="pours mono">${e.filterPours.map(p=>`${p.targetGrams} g @ ${Math.floor(p.startSeconds/60)}:${String(p.startSeconds%60).padStart(2,"0")}`).join(" → ")}</p>`:"";
    const ease=[e.dialEase,e.dialStability].filter(Boolean).join(", ");
    return `<details><summary>${esc(KITS[e.kitId]||(e.brewMethods||[]).join(", ")||"Brew")}${c.entries.length>1?" "+scoreEl(e.rating):""}<span class="sub">${esc(fmtDate(e.date))}</span></summary>
      <div class="dbody">${cells.length?`<div class="recipe">${cells.map(([v,l])=>`<div><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join("")}</div>`:`<p class="pours">No recipe recorded.</p>`}
      ${pours}${ease?`<p class="pours">Dial-in: ${esc(ease)}</p>`:""}${e.notes?`<p>${esc(e.notes)}</p>`:""}</div></details>`;
  }).join("");
  return `<div class="wrap">
    <div class="dhead"><button class="iconbtn" data-act="back">${ICON.back} Back</button><button class="iconbtn" data-act="share">${ICON.share} Share</button></div>
    <article>
      <div class="hero"><div style="min-width:0"><div class="roaster">${esc(c.roaster)}</div><h1>${esc(c.name)}</h1>
        <div class="where">${esc([c.origin,c.process].filter(Boolean).join(" · "))}${c.date?" · "+esc(fmtMonth(c.date)):""}</div></div>${scoreEl(c.rating,true)}</div>
      ${badges?`<div class="badges">${badges}</div>`:""}
      ${c.review?`<p class="verdict"><span class="lab">My verdict</span>${esc(c.review)}</p>`:""}
      ${notes.length?`<section class="section"><span class="lab">Roaster's tasting notes</span><div class="notes-chips">${notes.map(n=>`<span>${esc(n)}</span>`).join("")}</div></section>`:""}
      ${facts.length?`<section class="section"><span class="lab">The coffee</span><dl class="facts">${facts.map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>
        ${c.coffeeUrl?`<a class="link" href="${esc(c.coffeeUrl)}" target="_blank" rel="noopener">Roaster's page ↗</a>`:""}</section>`:""}
      <section class="section"><span class="lab">How I brewed it</span>${brews}
        ${c.coffeeDescription?`<details><summary>From the bag and roaster</summary><div class="dbody"><p>${esc(c.coffeeDescription)}</p></div></details>`:""}</section>
    </article>
    ${c.early?`<p class="foot">Early entry, before March 2026. Counts half in Palate.</p>`:""}
  </div>`;
}

/* ---------- palate ---------- */
const PRODUCERS=["Panama","Guatemala","Burundi","El Salvador","Yemen","Mexico","Bolivia","Ecuador","Papua New Guinea","China","India","Thailand","Myanmar","Kenya","Rwanda","Colombia","Ethiopia","Brazil","Costa Rica","Peru","Honduras","Nicaragua","Uganda","Tanzania","Indonesia","Vietnam"];
const PROCESSES=["Washed","Natural","Honey","Anaerobic","Carbonic maceration","Thermal shock","Wet-hulled","Co-fermented"];
function groupStats(entries,get,minN=2){ const g=new Map(); for(const e of entries) for(const v of get(e)){ if(!g.has(v)) g.set(v,[]); g.get(v).push(e); }
  return [...g.entries()].filter(([,a])=>a.length>=minN).map(([k,a])=>({k,n:a.length,m:wavg(a.map(e=>[e.rating,W(e)])),list:a})).sort((a,b)=>b.m-a.m); }
const monthsAgo=d=>{ const a=new Date(d), b=new Date(); return (b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth(); };
const r2=x=>x.toFixed(2), r1=x=>x.toFixed(1);

function palateHTML(){
  if(!SEED.entries.some(e=>e.rating>0&&e.date)) return `<div class="wrap"><header class="pal-head"><h1>Palate</h1></header><div class="empty">${SYNC.state==="error"?"Couldn't load the logbook.":"Loading the logbook…"}</div></div>`;
  const E=SEED.entries, R=E.filter(e=>e.rating>0), overall=wavg(R.map(e=>[e.rating,W(e)]));
  const C=S.coffees, roasters=new Set(E.map(e=>e.roaster)), orgs=new Set(E.flatMap(e=>origins(e.origin)));
  const dates=E.map(e=>e.date).filter(Boolean).sort(), since=dates[0];
  const byMonth=groupStats(E,e=>e.date?[e.date.slice(0,7)]:[],1).sort((a,b)=>b.n-a.n);
  const cards=[];

  // 1. intro
  cards.push(`<section class="w" style="--bgc:var(--w-lime)"><div class="k">Since ${fmtMonth(since)}</div>
    <div class="huge">${E.length}</div><h2 style="margin-top:4px">brews logged</h2>
    <div class="row3"><div><b>${C.length}</b><span>coffees</span></div><div><b>${roasters.size}</b><span>roasters</span></div><div><b>${orgs.size}</b><span>origins</span></div></div>
    <p>Busiest month: <b>${fmtMonth(byMonth[0].k)}</b>, ${byMonth[0].n} brews.</p></section>`);

  // 2. number one
  const top=[...C].sort((a,b)=>b.rating-a.rating||(b.date||"").localeCompare(a.date||""))[0];
  const quote=(top.review||"").split(/(?<=\.)\s/)[0];
  cards.push(`<section class="w" style="--bgc:var(--w-violet);--fg:#fff"><div class="k">Your number one</div>
    <h2 style="font-size:clamp(34px,10vw,48px)">${esc(top.name)}</h2><p style="opacity:.85">${esc(top.roaster)} · ${esc(top.origin)} · rated ${fmtR(top.rating)}</p>
    ${quote?`<p style="font:400 20px/1.4 var(--f-display);margin-top:14px">“${esc(quote)}”</p>`:""}
    <button class="inline" data-open="${top.key}">Open the coffee</button></section>`);

  // 3. roast face-off
  const roast=groupStats(R,e=>e.roastLevel?[e.roastLevel]:[]);
  const light=roast.find(s=>s.k==="Light"), darker=roast.filter(s=>s.k!=="Light").sort((a,b)=>b.n-a.n)[0];
  if(light&&darker){ const lightWins=light.m>=darker.m;
    cards.push(`<section class="w" style="--bgc:var(--w-coral)"><div class="k">Roast face-off</div>
      <h2>${lightWins?"You're a light-roast person.":"Darker roasts are winning."}</h2>
      <div class="vs"><div class="${lightWins?"":"lo"}"><b>${r1(light.m)}</b><span>Light · ${light.n}</span></div><em>vs</em><div class="${lightWins?"lo":""}"><b>${r1(darker.m)}</b><span>${esc(darker.k)} · ${darker.n}</span></div></div>
      <p>${roast.length?`${E.filter(e=>!e.roastLevel).length} brews have no roast level, so this could sharpen.`:""}</p></section>`); }

  // 4. magic word
  const tagStats=groupStats(R,e=>e.tags||[],4).filter(s=>!NEG_TAGS.has(s.k));
  if(tagStats.length){ const t=tagStats[0], worst=groupStats(R,e=>e.tags||[],3).filter(s=>NEG_TAGS.has(s.k)).sort((a,b)=>a.m-b.m)[0];
    cards.push(`<section class="w" style="--bgc:var(--w-yellow)"><div class="k">The magic word</div>
      <div class="huge" style="font-size:clamp(56px,17vw,92px)">${esc(t.k)}</div>
      <p>Coffees you tag <b>${esc(t.k)}</b> average <b>${r2(t.m)}</b>, against your overall ${r2(overall)}.${worst?` The kiss of death is <b>${esc(worst.k)}</b> at ${r2(worst.m)}.`:""}</p>
      <div class="tags dark">${groupStats(R,e=>e.tags||[],3).map(s=>`<span>${esc(s.k)}<small>${r1(s.m)}</small></span>`).join("")}</div></section>`); }

  // 5. roaster podium
  const rs=groupStats(R,e=>[e.roaster]);
  if(rs.length>=3){ const [a,b,c]=rs; const h=[110,140,90];
    cards.push(`<section class="w" style="--bgc:var(--w-sky)"><div class="k">Roaster podium</div><h2>${esc(a.k)} takes gold.</h2>
      <div class="podium">${[[b,2,h[0]],[a,1,h[1]],[c,3,h[2]]].map(([s,p,ht])=>`<div style="height:${ht}px"><small>#${p}</small><b>${r1(s.m)}</b><span>${esc(s.k)}</span><small>${s.n} brews</small></div>`).join("")}</div>
      <p>At least 2 brews to qualify. Bottom of the table: ${rs.slice(-2).map(s=>`${esc(s.k)} (${r1(s.m)})`).join(", ")}.</p></section>`); }

  // 6. origins
  const os=groupStats(R,e=>origins(e.origin));
  if(os.length>=4){ const best=os.slice(0,3), worst=os.slice(-3).reverse(); const most=[...os].sort((a,b)=>b.n-a.n)[0];
    cards.push(`<section class="w" style="--bgc:var(--w-green);--fg:#fff"><div class="k">Around the world</div><h2>Where your best cups grow</h2>
      <div class="split"><div><h3>Hall of fame</h3><ol>${best.map(s=>`<li><span>${esc(s.k)}</span><span>${r1(s.m)}</span></li>`).join("")}</ol></div>
        <div><h3>Hall of shame</h3><ol>${worst.map(s=>`<li><span>${esc(s.k)}</span><span>${r1(s.m)}</span></li>`).join("")}</ol></div></div>
      <p>${esc(most.k)} is your most-logged origin (${most.n} brews) and averages ${r1(most.m)}.</p></section>`); }

  // 7. weird things
  const weird=[];
  const kits=groupStats(R,e=>e.kitId?[e.kitId]:[],3); const ho=kits.find(s=>s.k==="home-espresso"), oo=kits.find(s=>s.k==="office-espresso");
  if(ho&&oo&&Math.abs(ho.m-oo.m)>=0.5){ const [w,l]=oo.m>ho.m?[oo,ho]:[ho,oo]; weird.push(`<b>${KITS[w.k]}</b> beats ${KITS[l.k].toLowerCase()}: ${r1(w.m)} vs ${r1(l.m)}. Same coffee style, different machine.`); }
  const cp=tagStats.find(s=>s.k==="crowd-pleaser"); if(cp&&tagStats[0].m-cp.m>=0.25) weird.push(`<b>Crowd-pleasers</b> average ${r1(cp.m)}. You respect them more than you love them.`);
  const noteWords=groupStats(R,e=>splitList(e.flavorNotes).map(w=>w.toLowerCase()),3).sort((a,b)=>a.m-b.m);
  if(noteWords.length&&noteWords[0].m<overall-0.3) weird.push(`Bags promising <b>${esc(noteWords[0].k)}</b> score ${r1(noteWords[0].m)} on average (${noteWords[0].n} bags). Read that label twice.`);
  const modes=[...groupStats(R,e=>[String(e.rating)],1)].sort((a,b)=>b.n-a.n)[0];
  if(modes) weird.push(`Your most common score is <b>${modes.k}</b>. Only ${Math.round(R.filter(e=>e.rating>=4).length/R.length*100)}% of brews reach 4 or more. Tough judge.`);
  const ext=groupStats(R,e=>/anaerob|experimental|thermal|carbonic/i.test(e.process||"")?["wild"]:["classic"],1); const wi=ext.find(s=>s.k==="wild"), cl=ext.find(s=>s.k==="classic");
  if(wi&&cl) weird.push(`Funky processes (anaerobic, experimental) average <b>${r1(wi.m)}</b> vs ${r1(cl.m)} for classic ones${wi.m>cl.m?". The wild stuff pays off.":"."}`);
  if(weird.length) cards.push(`<section class="w" style="--bgc:var(--w-ink);--fg:#fff"><div class="k">Weird but true</div><h2>Things the logbook noticed</h2><ul class="facts-list">${weird.map(x=>`<li>${x}</li>`).join("")}</ul></section>`);

  // 8. try next
  const triedO=new Set(E.flatMap(e=>origins(e.origin))); const newO=PRODUCERS.filter(p=>!triedO.has(p)).slice(0,6);
  const procText=E.map(e=>(e.process+" "+e.coffeeDescription).toLowerCase()).join(" ");
  const newP=PROCESSES.filter(p=>!procText.includes(p.toLowerCase().split(" ")[0].replace("-hulled","")));
  const methods=new Set(E.flatMap(e=>e.brewMethods||[])); const newM=["Espresso","Pour Over","French Press"].filter(m=>!methods.has(m));
  const thinO=os.filter(s=>s.n<=2&&s.m>=overall+0.4).map(s=>s.k);
  cards.push(`<section class="w" style="--bgc:var(--w-orange)"><div class="k">Uncharted</div><h2>What you haven't tried yet</h2>
    <p><b>Origins never logged</b></p><div class="tags">${newO.map(o=>`<span>${esc(o)}</span>`).join("")}</div>
    ${newP.length?`<p><b>Processes never logged</b></p><div class="tags">${newP.map(o=>`<span>${esc(o)}</span>`).join("")}</div>`:""}
    ${newM.length?`<p><b>Never brewed as</b></p><div class="tags">${newM.map(o=>`<span>${esc(o)}</span>`).join("")}</div>`:""}
    ${thinO.length?`<p>Small sample, big promise: <b>${thinO.map(esc).join(", ")}</b>. Worth a few more bags before you call it.</p>`:""}</section>`);

  // 9. worth revisiting
  const comeback=C.filter(c=>c.wouldBuy&&c.date&&monthsAgo(c.date)>=4).sort((a,b)=>b.rating-a.rating).slice(0,4);
  const lostR=rs.filter(s=>s.m>=overall+0.5).map(s=>({...s,last:s.list.map(e=>e.date).sort().pop()})).filter(s=>monthsAgo(s.last)>=4);
  const second=C.filter(c=>c.early&&c.rating>0&&c.rating<=2&&rs.some(s=>s.k===c.roaster&&s.m>=overall)).slice(0,3);
  if(comeback.length||lostR.length||second.length) cards.push(`<section class="w" style="--bgc:var(--w-pink)"><div class="k">Worth revisiting</div><h2>Time to go back?</h2>
    ${comeback.length?`<p><b>Would buy again, not bought in months</b></p><ul class="facts-list" style="margin-top:8px">${comeback.map(c=>`<li style="background:rgb(255 255 255 / .35)"><button data-open="${c.key}" style="all:unset;cursor:pointer;display:block"><b style="font-size:16px">${esc(c.name)}</b><br>${esc(c.roaster)} · ${fmtR(c.rating)} · ${fmtMonth(c.date)}</button></li>`).join("")}</ul>`:""}
    ${lostR.length?`<p><b>Roasters you rate highly but haven't had since:</b> ${lostR.map(s=>`${esc(s.k)} (${fmtMonth(s.last)})`).join(", ")}.</p>`:""}
    ${second.length?`<p><b>Second chance:</b> ${second.map(c=>esc(c.name)).join(", ")}. Logged early, before the grinder settled, from a roaster you now rate.</p>`:""}</section>`);

  // 10. notes loved vs not
  const word=(lo,hi)=>{ const m=new Map(); for(const e of R) if(e.rating>=lo&&e.rating<=hi) for(const w of splitList(e.flavorNotes).map(s=>s.toLowerCase())) m.set(w,(m.get(w)||0)+1); return [...m.entries()].filter(x=>x[1]>=2).sort((a,b)=>b[1]-a[1]).slice(0,8); };
  const loved=word(3.5,5), meh=word(0.5,2.5);
  if(loved.length||meh.length) cards.push(`<section class="w" style="--bgc:var(--w-cream)"><div class="k">On the bag</div><h2>Tasting notes that call your name</h2>
    <div class="split"><div style="background:rgb(22 155 98 / .15)"><h3>On coffees you loved</h3><div class="tags dark" style="margin-top:0">${loved.map(([w,n])=>`<span>${esc(w)}<small>${n}</small></span>`).join("")}</div></div>
      <div style="background:rgb(255 106 85 / .15)"><h3>On ones that missed</h3><div class="tags dark" style="margin-top:0">${meh.map(([w,n])=>`<span>${esc(w)}<small>${n}</small></span>`).join("")}</div></div></div></section>`);

  // nerdy
  const FT=[["roast","Roast"],["process","Process"],["origin","Origin"],["roaster","Roaster"],["tags","Tags"],["kit","Kit"]];
  const getter={roast:e=>e.roastLevel?[e.roastLevel]:[],process:e=>e.process?[e.process]:[],origin:e=>origins(e.origin),roaster:e=>[e.roaster],tags:e=>e.tags||[],kit:e=>e.kitId?[KITS[e.kitId]]:[]}[S.pf];
  const st=groupStats(R,getter); const x=v=>((v-1)/4*100).toFixed(1);
  const dots=st.map(s=>`<div class="drow"><span class="lb">${esc(s.k)}</span><span class="track"><span class="mean" style="left:${x(overall)}%"></span><span class="dot" style="left:${x(s.m)}%;--h:${hue(s.m)}"></span></span><span class="v">${r2(s.m)}<small>${s.n} brews</small></span></div>`).join("");
  const dated=R.filter(e=>e.date).sort((a,b)=>a.date.localeCompare(b.date)); const t0=Date.parse(dated[0].date), t1=Date.parse(dated[dated.length-1].date);
  const VW=340,VH=170,L=24,Rr=8,T=10,B=24, px=d=>L+(Date.parse(d)-t0)/(t1-t0||1)*(VW-L-Rr), py=r=>T+(5-r)/4.5*(VH-T-B);
  let ticks=""; const s0=new Date(t0); for(let d=new Date(s0.getFullYear(),s0.getMonth()+1,1); d.getTime()<=t1; d.setMonth(d.getMonth()+1)){ if(d.getMonth()%2) continue; const xx=px(d.toISOString().slice(0,10)); ticks+=`<text x="${xx.toFixed(1)}" y="${VH-6}" text-anchor="middle">${MONTHS[d.getMonth()]}</text>`; }
  const grid=[1,2,3,4,5].map(r=>`<line x1="${L}" x2="${VW-Rr}" y1="${py(r)}" y2="${py(r)}" stroke="var(--line)"/><text x="${L-6}" y="${py(r)+3}" text-anchor="end">${r}</text>`).join("");
  const roll=dated.map((e,i)=>[px(e.date),py(avg(dated.slice(Math.max(0,i-5),i+1).map(z=>z.rating)))]);
  const path="M"+roll.map(p=>p.map(v=>v.toFixed(1)).join(",")).join("L");
  const pts=dated.map(e=>`<circle cx="${px(e.date).toFixed(1)}" cy="${py(e.rating).toFixed(1)}" r="4.5" fill="hsl(${hue(e.rating)} 70% 45%)" fill-opacity="${e.isEarlyEntry?0.35:0.85}"><title>${esc(e.coffeeName)} · ${e.rating}</title></circle>`).join("");
  const bins=[]; for(let r=0.5;r<=5;r+=0.5) bins.push([r,R.filter(e=>e.rating===r).length]); const hmax=Math.max(...bins.map(b=>b[1]));

  return `<div class="wrap">
    <header class="pal-head"><h1>Palate</h1><p>Your coffee taste, recalculated on every sync.</p></header>
    ${cards.join("")}
    <section class="nerd"><h2>The nerdy bits</h2><p>Early entries (before March 2026) count half. Unrated brews are left out.</p>
      <div class="card"><h3>What predicts a good cup</h3><p class="sub">Average rating by group, 2+ brews. The grey line is your overall ${r2(overall)}.</p>
        <div class="chips" role="group" aria-label="Group by">${FT.map(([k,l])=>`<button class="chip" aria-pressed="${S.pf===k}" data-pf="${k}">${l}</button>`).join("")}</div>
        ${dots}<div class="axis"><div></div><div><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div><div></div></div></div>
      <div class="card"><h3>Your journey</h3><p class="sub">Every rated brew over time. The line is the average of your last six.</p>
        <svg viewBox="0 0 ${VW} ${VH}" width="100%" role="img" aria-label="Ratings over time">${grid}${ticks}<path d="${path}" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-opacity=".7"/>${pts}</svg></div>
      <div class="card"><h3>How you score</h3><p class="sub">${R.length} rated brews by score.</p>
        <div class="hist">${bins.map(([r,n])=>`<div style="height:${(n/hmax*100).toFixed(0)}%;--h:${hue(r)}"><span>${n||""}</span></div>`).join("")}</div>
        <div class="hlab">${bins.map(([r])=>`<span>${r}</span>`).join("")}</div></div>
      <div class="card"><h3>Gaps in the logbook</h3><p class="sub">Fill these and the stats above get sharper.</p>
        <div class="tags dark" style="margin-top:0">${[["roast level",e=>!e.roastLevel],["variety",e=>!e.variety],["producer",e=>!e.producer],["verdict",e=>!e.review],["rating",e=>!e.rating]].map(([l,f])=>[l,E.filter(f).length]).filter(x=>x[1]).map(([l,n])=>`<span>${n} without ${l}</span>`).join("")}</div></div>
    </section>
    <p class="foot">${syncLine()}</p>
  </div>`;
}

/* ---------- router & render ---------- */
let toastT;
function toast(msg){ clearTimeout(toastT); let t=$(".toast"); if(!t){ t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); document.body.appendChild(t);} t.textContent=msg; toastT=setTimeout(()=>t.remove(),2200); }
function route(){ const h=location.hash.slice(1); if(h.startsWith("c-")) return {view:"coffee",key:h}; if(h==="palate") return {view:"palate"}; return {view:"library"}; }
let lastView="library", scrolls={library:0,palate:0}, navDepth=0;
function render(){
  const r=route(), app=$("#app");
  if(r.view!=="coffee"&&lastView===r.view){}
  let html="";
  if(r.view==="coffee"){ const c=S.coffees.find(c=>c.key===r.key); html=c?detailHTML(c):`<div class="wrap empty">Coffee not found. <a href="#library">Back to the library</a></div>`; }
  else if(r.view==="palate") html=palateHTML(); else html=libraryHTML();
  const tab=r.view==="palate"?"palate":"library";
  html+=`<nav class="tabs" aria-label="Sections"><div class="in">
    <button class="tab" data-go="library" ${tab==="library"&&r.view!=="coffee"?'aria-current="page"':""}>${ICON.book} Library</button>
    <button class="tab" data-go="palate" ${tab==="palate"?'aria-current="page"':""}>${ICON.palate} Palate</button></div></nav>`;
  if(S.sheet&&r.view==="library") html+=sheetHTML();
  app.innerHTML=html;
  const so=$("#sort"), gr=$("#group"); if(so) so.value=S.sort; if(gr) gr.value=S.group;
}
function go(view){ if(lastView!=="coffee") scrolls[lastView]=scrollY; render(); const r=route().view; scrollTo(0, r==="coffee"?0:(lastView===r?scrollY:scrolls[r]||0)); lastView=r; }
function keep(fn){ const y=scrollY, sc=$(".sheet")?.scrollTop; fn(); render(); scrollTo(0,y); if(sc!=null&&$(".sheet")) $(".sheet").scrollTop=sc; }
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-open],[data-quick],[data-f],[data-unf],[data-act],[data-go],[data-pf]"); if(!t) return;
  if(t.dataset.open){ navDepth++; location.hash=t.dataset.open; return; }
  if(t.dataset.go){ if(location.hash.slice(1)===t.dataset.go||(!location.hash&&t.dataset.go==="library")){ scrollTo({top:0,behavior:"smooth"}); return; } location.hash=t.dataset.go; return; }
  if(t.dataset.quick){ S.quick=t.dataset.quick; render(); scrollTo(0,0); return; }
  if(t.dataset.pf){ return keep(()=>S.pf=t.dataset.pf); }
  if(t.dataset.f||t.dataset.unf){ const k=t.dataset.f||t.dataset.unf, v=t.dataset.v; return keep(()=>S.f[k].has(v)?S.f[k].delete(v):S.f[k].add(v)); }
  const a=t.dataset.act;
  if(a==="sheet"){ S.sheet=true; render(); }
  else if(a==="close"){ S.sheet=false; render(); }
  else if(a==="reset") keep(()=>{ for(const s of Object.values(S.f)) s.clear(); });
  else if(a==="clear"){ for(const s of Object.values(S.f)) s.clear(); S.q=""; S.quick="all"; render(); }
  else if(a==="back"){ if(navDepth>0){ navDepth--; history.back(); } else location.hash="library"; }
  else if(a==="share"){ const url=location.href; (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>toast("Link copied"),()=>toast("Copy the link from the address bar")); }
});
window.addEventListener("hashchange",()=>{ S.sheet=false; go(); });
document.addEventListener("input",e=>{ if(e.target.id==="q"){ S.q=e.target.value; const tmp=document.createElement("div"); tmp.innerHTML=libraryHTML(); $("#libmain").replaceWith(tmp.querySelector("#libmain")); $("#libcount").textContent=tmp.querySelector("#libcount").textContent; } });
document.addEventListener("change",e=>{ if(e.target.id==="sort"){ S.sort=e.target.value; saveView(); render(); } if(e.target.id==="group"){ S.group=e.target.value; saveView(); render(); } });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&S.sheet){ S.sheet=false; render(); } });
window.addEventListener("scroll",()=>{ const t=$(".top"); if(t) t.classList.toggle("scrolled",scrollY>4); },{passive:true});
function syncLine(){
  const t = SYNC.at ? new Date(SYNC.at).toLocaleString([], {day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) : "";
  const label = SYNC.state==="loading" ? "Syncing…" : SYNC.state==="error" ? (t?`Offline · showing data from ${t}.`:"Offline.") : `Synced ${t}.`;
  return `${label} <button class="chip" style="min-height:36px;margin-left:6px" data-act="refresh">Refresh</button>`;
}
function setData(data, at){ SEED = data; S.coffees = buildCoffees(data.entries||[]); SYNC.at = at; }
async function load(){
  SYNC.state = "loading";
  const urls = [`https://raw.githubusercontent.com/${REPO}/main/dialins.json?_=${Date.now()}`, `dialins.json?_=${Date.now()}`];
  for(const u of urls){
    try{
      const r = await fetch(u, {cache:"no-store"}); if(!r.ok) continue;
      const data = await r.json(); if(!Array.isArray(data.entries)) continue;
      const at = Date.now(); setData(data, at); SYNC.state = "ok";
      try{ localStorage.setItem(CACHE_KEY, JSON.stringify({at, data})); }catch(e){}
      keep(()=>{}); return;
    }catch(e){}
  }
  SYNC.state = "error"; keep(()=>{});
}
document.addEventListener("click", e => { if(e.target.closest('[data-act="refresh"]')) load(); });
document.addEventListener("visibilitychange", () => { if(document.visibilityState==="visible" && SYNC.at && Date.now()-SYNC.at > 60000) load(); });
try{ const c = JSON.parse(localStorage.getItem(CACHE_KEY)||"null"); if(c && c.data && Array.isArray(c.data.entries)) setData(c.data, c.at); }catch(e){}
render(); lastView=route().view;
load();
</script>
</body>
</html>
